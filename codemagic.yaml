# Codemagic CI/CD Configuration for AgyChat
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/

workflows:
  # ─── Debug Build ───────────────────────────────────────
  android-debug:
    name: AgyChat Debug Build
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      java: 17
      gradle: 8.7

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Run unit tests
        script: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/tests/**

    publishing:
      email:
        recipients:
          - you@example.com  # <-- apna email daal do
        notify:
          success: true
          failure: true

  # ─── Release Build ────────────────────────────────────
  android-release:
    name: AgyChat Release Build
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      java: 17
      gradle: 8.7
      groups:
        - keystore_credentials  # Codemagic dashboard mein set karo
      vars:
        CM_KEYSTORE_PATH: /tmp/keystore.jks

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_KEYSTORE_PATH

      - name: Run unit tests
        script: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest

      - name: Build release APK
        script: |
          ./gradlew assembleRelease

      - name: Build release AAB (Play Store)
        script: |
          ./gradlew bundleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/reports/tests/**

    publishing:
      email:
        recipients:
          - you@example.com  # <-- apna email daal do
        notify:
          success: true
          failure: true
